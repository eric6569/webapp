<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Taxi Meter 計程車計費器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #0d0d1a 0%, #1a1a2e 100%);
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 16px;
  }

  .container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0;
  }
  .header-icon { font-size: 28px; }
  .header-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #ffaa00;
    text-transform: uppercase;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
    font-size: 12px;
  }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #444;
    margin-right: 5px;
    vertical-align: middle;
  }
  .status-dot.running {
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
    animation: pulse 1.5s infinite;
  }
  .status-dot.paused { background: #ffaa00; }
  .status-label { color: #666; }
  .status-label.running { color: #00ff88; }
  .status-label.paused { color: #ffaa00; }
  .status-sep { color: #555; }
  .gps-status { font-size: 11px; color: #666; }
  .gps-status.active { color: #00ff88; }
  .gps-status.simulating { color: #ffaa00; }

  /* Fare display */
  .fare-panel {
    background: linear-gradient(180deg, #0a0a16 0%, #12122a 100%);
    border: 1px solid #2a2a44;
    border-radius: 16px;
    padding: 28px 32px 20px;
    width: 100%;
    margin-bottom: 16px;
    box-shadow: 0 4px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
    text-align: center;
  }
  .fare-label {
    font-size: 11px;
    color: #7777aa;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .fare-value {
    display: flex;
    align-items: baseline;
    justify-content: center;
  }
  .fare-currency {
    font-size: 20px;
    color: rgba(0,255,136,0.4);
    margin-right: 6px;
    font-weight: 600;
  }
  .fare-digits {
    font-family: 'Courier New', Courier, monospace;
    font-size: 56px;
    font-weight: 700;
    color: #00ff88;
    text-shadow: 0 0 12px rgba(0,255,136,0.5), 0 0 24px rgba(0,255,136,0.2);
    letter-spacing: 2px;
    line-height: 1;
  }
  .night-badge {
    margin-top: 10px;
    font-size: 11px;
    color: #ff6644;
    display: none;
  }
  .night-badge.visible { display: block; }

  /* Stats row */
  .stats-row {
    display: flex;
    width: 100%;
    background: #12122a;
    border: 1px solid #2a2a44;
    border-radius: 12px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .stat-block {
    flex: 1;
    text-align: center;
    padding: 12px 4px;
  }
  .stat-label {
    font-size: 11px;
    color: #7777aa;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: 'Courier New', Courier, monospace;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.1;
  }
  .stat-value.distance { color: #ffaa00; text-shadow: 0 0 8px rgba(255,170,0,0.25); }
  .stat-value.time { color: #cc88ff; text-shadow: 0 0 8px rgba(204,136,255,0.25); }
  .stat-value.speed { color: #ffaa00; text-shadow: 0 0 8px rgba(255,170,0,0.25); }
  .stat-value.speed.waiting { color: #ff6644; text-shadow: 0 0 8px rgba(255,102,68,0.25); }
  .stat-unit {
    font-size: 11px;
    color: #7777aa;
    margin-top: 4px;
  }
  .stat-sep {
    width: 1px;
    background: #2a2a44;
    margin: 10px 0;
  }

  /* Wait time bar */
  .wait-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #12122a;
    border: 1px solid #2a2a44;
    border-radius: 12px;
    padding: 10px 16px;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .wait-label { color: #7777aa; }
  .wait-value {
    font-family: 'Courier New', monospace;
    font-weight: 600;
    color: #444;
  }
  .wait-value.active { color: #ff6644; }
  .wait-fare { color: #7777aa; font-size: 11px; }

  /* Buttons */
  .controls {
    display: flex;
    gap: 12px;
    width: 100%;
    margin-bottom: 16px;
  }
  .btn {
    flex: 1;
    padding: 16px;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.97); }
  .btn-start {
    background: linear-gradient(135deg, #00cc66 0%, #00aa55 100%);
    color: #fff;
    box-shadow: 0 4px 16px rgba(0,204,102,0.3);
  }
  .btn-pause {
    background: transparent;
    border: 1px solid #ffaa00;
    color: #ffaa00;
  }
  .btn-stop {
    background: transparent;
    border: 1px solid #ff4444;
    color: #ff4444;
  }
  .btn.hidden { display: none; }

  /* Night toggle */
  .night-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #12122a;
    border: 1px solid #2a2a44;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .night-toggle-label { font-size: 13px; color: #aaa; }
  .toggle-track {
    width: 48px;
    height: 26px;
    border-radius: 13px;
    border: none;
    cursor: pointer;
    background: #333;
    position: relative;
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle-track.on { background: #00cc66; }
  .toggle-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    transition: left 0.2s;
    pointer-events: none;
  }
  .toggle-track.on .toggle-thumb { left: 25px; }

  /* Fare rules */
  .fare-rules {
    width: 100%;
    padding: 14px 16px;
    background: #12122a;
    border: 1px solid #2a2a44;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 11px;
    color: #666;
    line-height: 1.8;
  }
  .fare-rules-title {
    color: #888;
    font-weight: 600;
    margin-bottom: 4px;
    font-size: 12px;
  }

  /* History */
  .history { width: 100%; margin-bottom: 20px; }
  .history.hidden { display: none; }
  .history-title {
    font-size: 12px;
    color: #888;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: #12122a;
    border: 1px solid #2a2a44;
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .history-item .h-time { color: #777; }
  .history-item .h-dist { color: #aaa; font-family: monospace; }
  .history-item .h-dur { color: #aaa; }
  .history-item .h-fare { color: #00ff88; font-weight: 700; font-family: monospace; }
  .btn-clear {
    width: 100%;
    padding: 8px;
    font-size: 12px;
    border: 1px solid #333;
    border-radius: 8px;
    cursor: pointer;
    background: transparent;
    color: #666;
    margin-top: 4px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <span class="header-icon">🚕</span>
    <span class="header-title">Taxi Meter</span>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <span class="status-label" id="statusLabel">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">待機</span>
    </span>
    <span class="status-sep">|</span>
    <span class="gps-status" id="gpsStatus">GPS: 等待中</span>
  </div>

  <!-- Fare display -->
  <div class="fare-panel">
    <div class="fare-label">應付車資</div>
    <div class="fare-value">
      <span class="fare-currency">NT$</span>
      <span class="fare-digits" id="fareDisplay">85</span>
    </div>
    <div class="night-badge" id="nightBadge">🌙 夜間加成 +NT$20</div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-block">
      <div class="stat-label">里程</div>
      <div class="stat-value distance" id="distDisplay">0.00</div>
      <div class="stat-unit">km</div>
    </div>
    <div class="stat-sep"></div>
    <div class="stat-block">
      <div class="stat-label">時間</div>
      <div class="stat-value time" id="timeDisplay">00:00</div>
      <div class="stat-unit">&nbsp;</div>
    </div>
    <div class="stat-sep"></div>
    <div class="stat-block">
      <div class="stat-label">時速</div>
      <div class="stat-value speed" id="speedDisplay">0</div>
      <div class="stat-unit">km/h</div>
    </div>
  </div>

  <!-- Wait time -->
  <div class="wait-bar">
    <span class="wait-label">⏱ 等候時間</span>
    <span class="wait-value" id="waitDisplay">00:00</span>
    <span class="wait-fare" id="waitFare">(+NT$0)</span>
  </div>

  <!-- Controls -->
  <div class="controls" id="controlsIdle">
    <button class="btn btn-start" onclick="handleStart()">▶ 開始計費</button>
  </div>
  <div class="controls hidden" id="controlsRunning">
    <button class="btn btn-pause" onclick="handlePause()">⏸ 暫停</button>
    <button class="btn btn-stop" onclick="handleReset()">⏹ 結束</button>
  </div>
  <div class="controls hidden" id="controlsPaused">
    <button class="btn btn-start" onclick="handleResume()">▶ 繼續</button>
    <button class="btn btn-stop" onclick="handleReset()">⏹ 結束</button>
  </div>

  <!-- Night toggle -->
  <div class="night-toggle">
    <span class="night-toggle-label">🌙 夜間加成（23:00–06:00）</span>
    <button class="toggle-track" id="nightToggle" onclick="toggleNight()">
      <span class="toggle-thumb"></span>
    </button>
  </div>

  <!-- Fare rules -->
  <div class="fare-rules">
    <div class="fare-rules-title">費率說明</div>
    <div>起步價 NT$85（1.25 km 內）</div>
    <div>續程每 200m 跳 NT$5</div>
    <div>時速 5 km/h 以下，每 80 秒跳 NT$5</div>
    <div>夜間加成（23:00–06:00）+NT$20</div>
  </div>

  <!-- History -->
  <div class="history hidden" id="historySection">
    <div class="history-title">行程紀錄</div>
    <div id="historyList"></div>
    <button class="btn-clear" onclick="clearHistory()">清除紀錄</button>
  </div>
</div>

<script>
// === Fare rules ===
const RULES = {
  baseFare: 85,
  baseDistance: 1250,
  distanceUnit: 200,
  distanceRate: 5,
  waitTimeUnit: 80,
  waitTimeRate: 5,
  speedThreshold: 5,
  nightSurcharge: 20,
};

// === State ===
let status = "idle"; // idle | running | paused
let distance = 0;     // meters
let elapsed = 0;      // seconds
let waitTime = 0;     // seconds
let speed = 0;        // km/h
let isNight = (() => { const h = new Date().getHours(); return h >= 23 || h < 6; })();
let history = [];

let lastPos = null;
let watchId = null;
let timerInterval = null;
let startTimestamp = null;
let pausedElapsed = 0;
let simInterval = null;

// === DOM refs ===
const $ = (id) => document.getElementById(id);

// === Haversine distance ===
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// === Fare calc ===
function calcFare() {
  let fare = RULES.baseFare;
  if (isNight) fare += RULES.nightSurcharge;
  const extraDist = Math.max(0, distance - RULES.baseDistance);
  fare += Math.floor(extraDist / RULES.distanceUnit) * RULES.distanceRate;
  fare += Math.floor(waitTime / RULES.waitTimeUnit) * RULES.waitTimeRate;
  return fare;
}

// === Format time ===
function fmtTime(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

// === UI update ===
function updateUI() {
  const fare = calcFare();
  $("fareDisplay").textContent = fare.toLocaleString("en-US");
  $("distDisplay").textContent = (distance / 1000).toFixed(2);
  $("timeDisplay").textContent = fmtTime(elapsed);
  $("speedDisplay").textContent = speed;
  $("waitDisplay").textContent = fmtTime(waitTime);
  $("waitFare").textContent = `(+NT$${Math.floor(waitTime / RULES.waitTimeUnit) * RULES.waitTimeRate})`;

  // Speed color
  const speedEl = $("speedDisplay");
  speedEl.classList.toggle("waiting", speed < RULES.speedThreshold && status === "running");

  // Wait time color
  $("waitDisplay").classList.toggle("active", waitTime > 0);

  // Night badge
  $("nightBadge").classList.toggle("visible", isNight);

  // Night toggle
  $("nightToggle").classList.toggle("on", isNight);

  // Status
  const dot = $("statusDot");
  const label = $("statusLabel");
  dot.className = "status-dot " + status;
  label.className = "status-label " + status;
  $("statusText").textContent = status === "idle" ? "待機" : status === "running" ? "計費中" : "暫停";

  // Controls
  $("controlsIdle").classList.toggle("hidden", status !== "idle");
  $("controlsRunning").classList.toggle("hidden", status !== "running");
  $("controlsPaused").classList.toggle("hidden", status !== "paused");

  // History
  $("historySection").classList.toggle("hidden", history.length === 0);
}

// === GPS status ===
function setGpsStatus(s) {
  const el = $("gpsStatus");
  el.className = "gps-status " + s;
  const labels = { waiting: "GPS: 等待中", active: "GPS: 定位中", simulating: "GPS: 模擬模式", error: "GPS: 無訊號" };
  el.textContent = labels[s] || "GPS: 等待中";
}

// === Simulation (when GPS unavailable) ===
function startSimulation() {
  setGpsStatus("simulating");
  simInterval = setInterval(() => {
    const baseSpeed = 25 + Math.random() * 20;
    const isWaiting = Math.random() < 0.15;
    const cur = isWaiting ? 0 : Math.round(baseSpeed);
    speed = cur;
    if (cur < RULES.speedThreshold) waitTime++;
    distance += (cur * 1000) / 3600;
    updateUI();
  }, 1000);
}

function stopGps() {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (simInterval !== null) { clearInterval(simInterval); simInterval = null; }
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

// === Controls ===
function handleStart() {
  status = "running";
  lastPos = null;
  startTimestamp = Date.now() - pausedElapsed * 1000;

  timerInterval = setInterval(() => {
    elapsed = Math.floor((Date.now() - startTimestamp) / 1000);
    updateUI();
  }, 1000);

  if (!navigator.geolocation) {
    startSimulation();
    updateUI();
    return;
  }

  let gpsFailed = false;

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      setGpsStatus("active");
      const { latitude, longitude, speed: gpsSpeed } = pos.coords;
      const cur = gpsSpeed != null ? Math.round(gpsSpeed * 3.6) : 0;
      speed = cur;
      if (cur < RULES.speedThreshold) waitTime++;

      if (lastPos) {
        const d = haversine(lastPos.lat, lastPos.lon, latitude, longitude);
        if (d > 3 && d < 200) distance += d;
      }
      lastPos = { lat: latitude, lon: longitude };
      updateUI();
    },
    (err) => {
      if (!gpsFailed) {
        gpsFailed = true;
        startSimulation();
      }
    },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 5000 }
  );
  updateUI();
}

function handlePause() {
  status = "paused";
  pausedElapsed = elapsed;
  stopGps();
  stopTimer();
  updateUI();
}

function handleResume() {
  handleStart();
}

function handleReset() {
  status = "idle";
  stopGps();
  stopTimer();

  if (distance > 0) {
    const now = new Date();
    history.push({
      fare: calcFare(),
      distance,
      elapsed,
      waitTime,
      isNight,
      time: now.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" }),
    });
    renderHistory();
  }

  distance = 0;
  elapsed = 0;
  waitTime = 0;
  speed = 0;
  lastPos = null;
  pausedElapsed = 0;
  setGpsStatus("waiting");
  updateUI();
}

function toggleNight() {
  isNight = !isNight;
  updateUI();
}

// === History ===
function renderHistory() {
  const list = $("historyList");
  list.innerHTML = "";
  history.forEach((trip) => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `
      <span class="h-time">${trip.time} ${trip.isNight ? "🌙" : "☀️"}</span>
      <span class="h-dist">${(trip.distance / 1000).toFixed(2)} km</span>
      <span class="h-dur">${fmtTime(trip.elapsed)}</span>
      <span class="h-fare">$${trip.fare.toLocaleString()}</span>
    `;
    list.appendChild(div);
  });
}

function clearHistory() {
  history = [];
  renderHistory();
  updateUI();
}

// === Init ===
updateUI();
</script>
</body>
</html>

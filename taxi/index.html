<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Taxi Meter 計程車計費器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #000;
    color: #b0b0b0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 16px;
  }

  .container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 16px;
    font-size: 18px;
    color: #707070;
  }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #404040;
    margin-right: 5px;
    vertical-align: middle;
  }
  .status-dot.running {
    background: #66dd44;
    box-shadow: 0 0 8px #66dd44;
    animation: pulse 1.5s infinite;
  }
  .status-dot.paused { background: #ccaa33; }
  .status-running { color: #aaa; }
  .status-paused { color: #ccaa33; }
  .gps-active { color: #aaa; }
  .gps-sim { color: #ccaa33; }

  /* LCD Panel */
  .lcd-panel {
    background: #8aad32;
    border: 3px solid #5a7a22;
    border-radius: 14px;
    padding: 22px 24px 18px;
    width: 100%;
    margin-bottom: 14px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.15), 0 4px 20px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .lcd-panel::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
  }
  .lcd-label {
    font-size: 21px;
    color: #3a5518;
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-align: center;
    font-weight: 600;
  }

  /* Fare digits */
  .fare-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
  }
  .fare-currency {
    font-size: 20px;
    font-weight: 700;
    color: rgba(26,40,10,0.4);
  }
  .fare-digits {
    font-weight: 700;
    color: #000;
    font-size: 56px;
  }

  .night-badge {
    text-align: center;
    margin-top: 8px;
    font-size: 11px;
    color: #3a2208;
    font-weight: 600;
    display: none;
  }
  .night-badge.visible { display: block; }

  /* Stats row */
  .stats-row {
    display: flex;
    flex-direction: column;
    width: 100%;
    background: #8aad32;
    border: 3px solid #5a7a22;
    border-radius: 14px;
    padding: 4px 20px;
    margin-bottom: 14px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.15), 0 4px 20px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .stats-row::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
  }
  .stat-lcd {
    display: flex;
    align-items: center;
    padding: 10px 0;
  }
  .stat-lcd + .stat-lcd {
    border-top: 1px solid rgba(58,85,24,0.35);
  }
  .stat-label {
    width: 60px;
    flex-shrink: 0;
    font-size: 16px;
    color: #3a5518;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .stat-value {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .stat-digits {
    font-weight: 700;
    color: #000;
    font-size: 30px;
  }
  .stat-unit {
    font-size: 10px;
    color: #3a5518;
    font-weight: 600;
  }

  /* Wait bar */
  .wait-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .wait-label { color: #888; }
  .wait-value {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    color: #555;
    font-size: 15px;
  }
  .wait-value.active { color: #ddd; }
  .wait-fare { color: #888; font-size: 11px; }

  /* Buttons */
  .controls {
    display: flex;
    gap: 12px;
    width: 100%;
    margin-bottom: 16px;
  }
  .btn {
    flex: 1;
    padding: 16px;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.97); }
  .btn-start {
    background: linear-gradient(135deg, #e0e0e0 0%, #bbb 100%);
    color: #111;
    box-shadow: 0 4px 16px rgba(255,255,255,0.1);
  }
  .btn-pause {
    background: transparent;
    border: 2px solid #ccaa33;
    color: #ccaa33;
  }
  .btn-stop {
    background: transparent;
    border: 2px solid #cc4444;
    color: #cc4444;
  }
  .hidden { display: none !important; }

  /* Night toggle */
  .night-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .night-toggle-label { font-size: 13px; color: #aaa; }
  .toggle-track {
    width: 48px; height: 26px;
    border-radius: 13px;
    border: none;
    cursor: pointer;
    background: #333;
    position: relative;
    transition: background 0.2s;
  }
  .toggle-track.on { background: #ccaa33; }
  .toggle-thumb {
    position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #e0e0e0;
    transition: left 0.2s;
    pointer-events: none;
  }
  .toggle-track.on .toggle-thumb { left: 25px; }

  .fare-rules {
    width: 100%;
    padding: 14px 16px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 11px;
    color: #777;
    line-height: 1.8;
  }
  .fare-rules-title {
    color: #aaa;
    font-weight: 600;
    margin-bottom: 4px;
    font-size: 12px;
  }

  .history { width: 100%; margin-bottom: 16px; }
  .history-title {
    font-size: 12px;
    color: #aaa;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .h-time { color: #888; }
  .h-dist { color: #aaa; font-family: monospace; }
  .h-dur { color: #aaa; }
  .h-fare { color: #ddd; font-weight: 700; font-family: monospace; }
  .btn-clear {
    width: 100%;
    padding: 8px;
    font-size: 12px;
    border: 1px solid #333;
    border-radius: 8px;
    cursor: pointer;
    background: transparent;
    color: #777;
    margin-top: 4px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="status-bar">
    <span id="statusLabel">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">待機</span>
    </span>
    <span style="color:#444">|</span>
    <span id="gpsStatus">GPS: 等待中</span>
  </div>

  <div class="lcd-panel">
    <div class="lcd-label">應付車資</div>
    <div class="fare-row">
      <span class="fare-currency">NT$</span>
      <span class="fare-digits" id="fareDisplay"></span>
    </div>
    <div class="night-badge" id="nightBadge">🌙 夜間加成 +NT$20</div>
  </div>

  <div class="stats-row">
    <div class="stat-lcd">
      <div class="stat-label">里程</div>
      <div class="stat-value">
        <div class="stat-digits" id="distDisplay"></div>
        <span class="stat-unit">km</span>
      </div>
    </div>
    <div class="stat-lcd">
      <div class="stat-label">時間</div>
      <div class="stat-value">
        <div class="stat-digits" id="timeDisplay"></div>
      </div>
    </div>
    <div class="stat-lcd">
      <div class="stat-label">時速</div>
      <div class="stat-value">
        <div class="stat-digits" id="speedDisplay"></div>
        <span class="stat-unit">km/h</span>
      </div>
    </div>
  </div>

  <div class="wait-bar">
    <span class="wait-label">⏱ 等候時間</span>
    <span class="wait-value" id="waitDisplay">00:00</span>
    <span class="wait-fare" id="waitFare">(+NT$0)</span>
  </div>

  <div class="controls">
    <button class="btn btn-start" id="btnStart" onclick="onStart()">▶ 開始計費</button>
    <button class="btn btn-pause hidden" id="btnPause" onclick="onPause()">⏸ 暫停</button>
    <button class="btn btn-stop hidden" id="btnStop" onclick="onReset()">⏹ 結束</button>
  </div>

  <div class="night-toggle">
    <span class="night-toggle-label">🌙 夜間加成（23:00–06:00）</span>
    <button class="toggle-track" id="nightToggle" onclick="toggleNight()">
      <span class="toggle-thumb"></span>
    </button>
  </div>

  <div class="fare-rules">
    <div class="fare-rules-title">費率說明</div>
    <div>起步價 NT$85（1.25 km 內）</div>
    <div>續程每 200m 跳 NT$5</div>
    <div>時速 5 km/h 以下，每 80 秒跳 NT$5</div>
    <div>夜間加成（23:00–06:00）+NT$20</div>
  </div>

  <div class="history hidden" id="historySection">
    <div class="history-title">行程紀錄</div>
    <div id="historyList"></div>
    <button class="btn-clear" onclick="clearHistory()">清除紀錄</button>
  </div>
</div>

<script>
// ===== Fare rules =====
const R = {
  baseFare:85, baseDist:1250,
  dUnit:200, dRate:5,
  wUnit:80, wRate:5,
  sTh:5, nPlus:20,
};

// ===== State =====
let status='idle', dist=0, elapsed=0, waitTime=0, speed=0;
let isNight=(()=>{const h=new Date().getHours();return h>=23||h<6})();
let hist=[];
let lastPos=null, watchId=null, timerRef=null, startTS=null, pausedE=0, simRef=null;
const $=id=>document.getElementById(id);

function hav(a1,o1,a2,o2){const R2=6371e3,dL=(a2-a1)*Math.PI/180,dO=(o2-o1)*Math.PI/180,a=Math.sin(dL/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dO/2)**2;return R2*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}

function fare(){let f=R.baseFare;if(isNight)f+=R.nPlus;f+=Math.floor(Math.max(0,dist-R.baseDist)/R.dUnit)*R.dRate;f+=Math.floor(waitTime/R.wUnit)*R.wRate;return f}

function fmt(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;if(h>0)return h+':'+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');return String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0')}

function updateUI(){
  $('fareDisplay').textContent = fare().toLocaleString('en-US');
  $('distDisplay').textContent = (dist/1000).toFixed(2);
  $('timeDisplay').textContent = fmt(elapsed);
  $('speedDisplay').textContent = String(speed).padStart(2,'0');

  const wE=$('waitDisplay');
  wE.textContent=fmt(waitTime);
  wE.classList.toggle('active',waitTime>0);
  $('waitFare').textContent='(+NT$'+Math.floor(waitTime/R.wUnit)*R.wRate+')';

  $('nightBadge').classList.toggle('visible',isNight);
  $('nightToggle').classList.toggle('on',isNight);

  $('statusDot').className='status-dot'+(status==='running'?' running':status==='paused'?' paused':'');
  $('statusLabel').className=status==='running'?'status-running':status==='paused'?'status-paused':'';
  $('statusText').textContent=status==='idle'?'待機':status==='running'?'計費中':'暫停';

  const bs=$('btnStart'),bp=$('btnPause'),bt=$('btnStop');
  if(status==='idle'){
    bs.classList.remove('hidden'); bs.textContent='▶ 開始計費';
    bp.classList.add('hidden'); bt.classList.add('hidden');
  } else if(status==='running'){
    bs.classList.add('hidden');
    bp.classList.remove('hidden'); bt.classList.remove('hidden');
  } else {
    bs.classList.remove('hidden'); bs.textContent='▶ 繼續';
    bp.classList.add('hidden'); bt.classList.remove('hidden');
  }

  $('historySection').classList.toggle('hidden',hist.length===0);
}

function setGps(s){
  const e=$('gpsStatus');
  e.className=s==='active'?'gps-active':s==='simulating'?'gps-sim':'';
  e.textContent={waiting:'GPS: 等待中',active:'GPS: 定位中',simulating:'GPS: 模擬模式'}[s]||'GPS: 等待中';
}

function startSim(){
  setGps('simulating');
  simRef=setInterval(()=>{
    const b=25+Math.random()*20;
    speed=Math.random()<0.15?0:Math.round(b);
    if(speed<R.sTh)waitTime++;
    dist+=(speed*1000)/3600;
    updateUI();
  },1000);
}
function stopG(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}if(simRef!==null){clearInterval(simRef);simRef=null}}
function stopT(){if(timerRef){clearInterval(timerRef);timerRef=null}}

function startMeter(){
  status='running'; lastPos=null;
  startTS=Date.now()-pausedE*1000;
  timerRef=setInterval(()=>{elapsed=Math.floor((Date.now()-startTS)/1000);updateUI()},1000);
  if(!navigator.geolocation){startSim();updateUI();return}
  let gf=false;
  watchId=navigator.geolocation.watchPosition(
    p=>{setGps('active');const{latitude:la,longitude:lo,speed:gs}=p.coords;speed=gs!=null?Math.round(gs*3.6):0;if(speed<R.sTh)waitTime++;if(lastPos){const d=hav(lastPos.lat,lastPos.lon,la,lo);if(d>3&&d<200)dist+=d}lastPos={lat:la,lon:lo};updateUI()},
    ()=>{if(!gf){gf=true;startSim()}},
    {enableHighAccuracy:true,maximumAge:2000,timeout:5000}
  );
  updateUI();
}

function onStart(){startMeter()}
function onPause(){status='paused';pausedE=elapsed;stopG();stopT();updateUI()}
function onReset(){
  stopG();stopT();
  if(dist>0){
    const n=new Date();
    hist.push({fare:fare(),distance:dist,elapsed,waitTime,isNight,time:n.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})});
    renderHist();
  }
  status='idle';dist=0;elapsed=0;waitTime=0;speed=0;lastPos=null;pausedE=0;
  setGps('waiting');updateUI();
}
function toggleNight(){isNight=!isNight;updateUI()}

function renderHist(){
  $('historyList').innerHTML=hist.map(t=>`<div class="history-item"><span class="h-time">${t.time} ${t.isNight?'🌙':'☀️'}</span><span class="h-dist">${(t.distance/1000).toFixed(2)} km</span><span class="h-dur">${fmt(t.elapsed)}</span><span class="h-fare">$${t.fare.toLocaleString()}</span></div>`).join('');
}
function clearHistory(){hist=[];renderHist();updateUI()}

updateUI();
</script>
</body>
</html>

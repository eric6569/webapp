<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Taxi Meter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #000;
    color: #b0b0b0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 16px;
  }

  .container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .status-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px 16px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 18px;
    color: #707070;
  }
  .status-dot {
    display: inline-block;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #404040;
    margin-right: 5px;
    vertical-align: middle;
  }
  .status-dot.running {
    background: #66dd44;
    box-shadow: 0 0 10px #66dd44;
    animation: pulse 1.5s infinite;
  }
  .status-dot.paused { background: #ccaa33; }
  .status-running { color: #aaa; }
  .status-paused { color: #ccaa33; }
  .gps-active { color: #aaa; }
  .gps-error { color: #cc4444; }
  .app-version { font-size: 18px; color: #555; }

  /* LCD Panel */
  .lcd-panel {
    background: #8aad32;
    border: 3px solid #5a7a22;
    border-radius: 14px;
    padding: 9px 20px 9px;
    width: 100%;
    margin-bottom: 14px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.15), 0 4px 20px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .lcd-label {
    font-size: 21px;
    color: #3a5518;
    letter-spacing: 2px;
    margin-bottom: 5px;
    text-align: center;
    font-weight: 600;
  }

  /* Fare digits */
  .fare-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
  }
  .fare-currency {
    font-size: 25px;
    font-weight: 700;
    color: rgba(26,40,10,0.4);
    line-height: 1;
  }
  .fare-digits {
    font-weight: 700;
    color: #000;
    font-size: 75px;
    line-height: 1;
  }

  .night-badge {
    text-align: center;
    margin-top: 8px;
    font-size: 11px;
    color: #3a2208;
    font-weight: 600;
    display: none;
  }
  .night-badge.visible { display: block; }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: auto auto auto;
    justify-content: center;
    align-items: baseline;
    column-gap: 10px;
    width: 100%;
    background: #8aad32;
    border: 3px solid #5a7a22;
    border-radius: 14px;
    padding: 4px 20px;
    margin-bottom: 14px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.15), 0 4px 20px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  .stats-row > * {
    padding: 2.5px 0;
  }
  .stat-label {
    justify-self: start;
    margin-right: 24px;
    font-size: 16px;
    color: #3a5518;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .stat-digits {
    justify-self: end;
    font-weight: 700;
    color: #000;
    font-size: 30px;
  }
  .stat-unit {
    justify-self: start;
    font-size: 12px;
    color: #3a5518;
    font-weight: 600;
  }

  /* Buttons */
  .controls {
    display: flex;
    gap: 12px;
    width: 100%;
    margin-bottom: 16px;
  }
  .btn {
    flex: 1;
    padding: 16px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-start {
    background: linear-gradient(135deg, #e0e0e0 0%, #bbb 100%);
    color: #111;
    box-shadow: 0 4px 16px rgba(255,255,255,0.1);
  }
  .btn-pause {
    background: transparent;
    border: 2px solid #ccaa33;
    color: #ccaa33;
  }
  .btn-stop {
    background: transparent;
    border: 2px solid #cc4444;
    color: #cc4444;
  }
  .hidden { display: none !important; }

  /* Night toggle */
  .settings-box {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .night-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
  }
  .night-toggle + .night-toggle {
    border-top: 1px solid #333;
  }
  .night-toggle-label { font-size: 13px; color: #aaa; }
  .toggle-track {
    width: 48px; height: 26px;
    border-radius: 13px;
    border: none;
    cursor: pointer;
    background: #333;
    position: relative;
    transition: background 0.2s;
  }
  .toggle-track.on { background: #ccaa33; }
  .toggle-thumb {
    position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #e0e0e0;
    transition: left 0.2s;
    pointer-events: none;
  }
  .toggle-track.on .toggle-thumb { left: 25px; }

  .fare-rules {
    width: 100%;
    padding: 14px 16px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 11px;
    color: #777;
    line-height: 1.8;
  }
  .fare-rules-title {
    color: #aaa;
    font-weight: 600;
    margin-bottom: 4px;
    font-size: 12px;
  }

  .history { width: 100%; margin-bottom: 16px; }
  .history-title {
    font-size: 12px;
    color: #aaa;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .h-time { color: #888; }
  .h-dist { color: #aaa; font-family: monospace; }
  .h-dur { color: #aaa; }
  .h-fare { color: #ddd; font-weight: 700; font-family: monospace; }
  .btn-clear {
    width: 100%;
    padding: 8px;
    font-size: 12px;
    border: 1px solid #333;
    border-radius: 8px;
    cursor: pointer;
    background: transparent;
    color: #777;
    margin-top: 4px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="status-bar">
    <span id="statusLabel">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">待機</span>
    </span>
    <span style="color:#444">|</span>
    <span id="gpsStatus">GPS: 等待中</span>
    <span style="color:#444">|</span>
    <span class="app-version">v1.3.3</span>
  </div>

  <div class="lcd-panel">
    <div class="lcd-label">應付車資</div>
    <div class="fare-row">
      <span class="fare-currency">NT$</span>
      <span class="fare-digits" id="fareDisplay"></span>
    </div>
    <div class="night-badge" id="nightBadge">🌙 夜間加成 +NT$20</div>
  </div>

  <div class="stats-row">
    <div class="stat-label">等候</div>
    <div class="stat-digits" id="waitDisplay">00:00</div>
    <span class="stat-unit" id="waitFare">(+NT$0)</span>

    <div class="stat-label">里程</div>
    <div class="stat-digits" id="distDisplay"></div>
    <span class="stat-unit">km</span>

    <div class="stat-label">時間</div>
    <div class="stat-digits" id="timeDisplay"></div>
    <span class="stat-unit">mm:ss</span>

    <div class="stat-label">時速</div>
    <div class="stat-digits" id="speedDisplay"></div>
    <span class="stat-unit">km/h</span>

    <div class="stat-label">最高</div>
    <div class="stat-digits" id="maxSpeedDisplay"></div>
    <span class="stat-unit">km/h</span>
  </div>

  <div class="controls">
    <button class="btn btn-start" id="btnStart" onclick="onStart()">▶ 開始計費</button>
    <button class="btn btn-pause hidden" id="btnPause" onclick="onPause()">⏸ 暫停</button>
    <button class="btn btn-stop hidden" id="btnStop" onclick="onReset()">⏹ 結束</button>
  </div>

  <div class="settings-box">
    <div class="night-toggle">
      <span class="night-toggle-label">🌙 夜間加成（23:00–06:00）</span>
      <button class="toggle-track" id="nightToggle" onclick="toggleNight()">
        <span class="toggle-thumb"></span>
      </button>
    </div>

    <div class="night-toggle">
      <span class="night-toggle-label">🔇 靜音</span>
      <button class="toggle-track" id="muteToggle" onclick="toggleMute()">
        <span class="toggle-thumb"></span>
      </button>
    </div>

    <div class="night-toggle">
      <span class="night-toggle-label">🔆 螢幕常亮</span>
      <button class="toggle-track" id="wakeLockToggle" onclick="toggleWakeLockSetting()">
        <span class="toggle-thumb"></span>
      </button>
    </div>
  </div>

  <div class="fare-rules">
    <div class="fare-rules-title">費率說明</div>
    <div>起步價 NT$85（1.25 km 內）</div>
    <div>續程每 200m 跳 NT$5</div>
    <div>時速 5 km/h 以下，每 60 秒跳 NT$5</div>
    <div>夜間加成（23:00–06:00）+NT$20</div>
  </div>

  <div class="history hidden" id="historySection">
    <div class="history-title">行程紀錄</div>
    <div id="historyList"></div>
    <button class="btn-clear" onclick="clearHistory()">清除紀錄</button>
  </div>
</div>

<script>
// ===== Fare rules =====
const R = {
  baseFare:85, baseDist:1250,
  dUnit:200, dRate:5,
  wUnit:60, wRate:5,
  sTh:5, nPlus:20,
};

// ===== State =====
let status='idle', dist=0, elapsed=0, waitTime=0, speed=0, maxSpeed=0;
let isNight=(()=>{const h=new Date().getHours();return h>=23||h<6})();
let hist=[];
let lastPos=null, watchId=null, timerRef=null, startTS=null, pausedE=0, lastFare=null, gpsReady=false, muted=false;
function toggleMute(){muted=!muted;updateUI()}
const $=id=>document.getElementById(id);

// ===== Wake lock =====
let wakeLock=null, wakeLockEnabled=true;
async function requestWakeLock(){
  if(!wakeLockEnabled) return;
  if(!('wakeLock' in navigator)) return;
  try{
    wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',()=>{wakeLock=null});
  }catch(e){wakeLock=null}
}
function releaseWakeLock(){
  if(wakeLock){wakeLock.release();wakeLock=null}
}
function toggleWakeLockSetting(){
  wakeLockEnabled=!wakeLockEnabled;
  if(wakeLockEnabled){
    if(status==='running') requestWakeLock();
  } else {
    releaseWakeLock();
  }
  updateUI();
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && status==='running' && wakeLockEnabled && !wakeLock) requestWakeLock();
});

// ===== Sound effects =====
let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(ctx,freq,start,dur,peak=0.45){
  if(muted) return;
  const osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type='triangle'; osc.frequency.value=freq;
  gain.gain.setValueAtTime(0,start);
  gain.gain.linearRampToValueAtTime(peak,start+0.008);
  gain.gain.exponentialRampToValueAtTime(0.001,start+dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(start); osc.stop(start+dur+0.02);
}
function playStartSound(){ // 開始計費
  const ctx=getAudioCtx(), t0=ctx.currentTime;
  tone(ctx,659.25,t0,0.12,0.45);
  tone(ctx,783.99,t0+0.1,0.12,0.45);
  tone(ctx,1046.5,t0+0.2,0.2,0.45);
}
function playTickSound(){ // 跳表
  const ctx=getAudioCtx(), t0=ctx.currentTime;
  tone(ctx,880,t0,0.13,0.45);
  tone(ctx,1318.5,t0+0.1,0.18,0.45);
}
function playPauseSound(){ // 暫停
  const ctx=getAudioCtx(), t0=ctx.currentTime;
  tone(ctx,659.25,t0,0.13,0.4);
  tone(ctx,440,t0+0.11,0.2,0.4);
}
function playStopSound(){ // 結束
  const ctx=getAudioCtx(), t0=ctx.currentTime;
  tone(ctx,880,t0,0.13,0.45);
  tone(ctx,659.25,t0+0.11,0.13,0.45);
  tone(ctx,440,t0+0.22,0.26,0.45);
}

function hav(a1,o1,a2,o2){const R2=6371e3,dL=(a2-a1)*Math.PI/180,dO=(o2-o1)*Math.PI/180,a=Math.sin(dL/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dO/2)**2;return R2*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}

function fare(){let f=R.baseFare;if(isNight)f+=R.nPlus;f+=Math.floor(Math.max(0,dist-R.baseDist)/R.dUnit)*R.dRate;f+=Math.floor(waitTime/R.wUnit)*R.wRate;return f}

function fmt(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;if(h>0)return h+':'+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');return String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0')}

function updateUI(){
  const f=fare();
  if(status==='running' && lastFare!==null && f>lastFare) playTickSound();
  lastFare=f;
  $('fareDisplay').textContent = f.toLocaleString('en-US');
  $('distDisplay').textContent = (dist/1000).toFixed(2);
  $('timeDisplay').textContent = fmt(elapsed);
  $('speedDisplay').textContent = String(speed);
  if(speed>maxSpeed) maxSpeed=speed;
  $('maxSpeedDisplay').textContent = String(maxSpeed);

  $('waitDisplay').textContent=fmt(waitTime);
  $('waitFare').textContent='(+NT$'+Math.floor(waitTime/R.wUnit)*R.wRate+')';

  $('nightBadge').classList.toggle('visible',isNight);
  $('nightToggle').classList.toggle('on',isNight);
  $('wakeLockToggle').classList.toggle('on',wakeLockEnabled);
  $('muteToggle').classList.toggle('on',muted);

  $('statusDot').className='status-dot'+(status==='running'?' running':status==='paused'?' paused':'');
  $('statusLabel').className=status==='running'?'status-running':status==='paused'?'status-paused':'';
  $('statusText').textContent=status==='idle'?'待機':status==='running'?'計費中':'暫停';

  const bs=$('btnStart'),bp=$('btnPause'),bt=$('btnStop');
  if(status==='idle'){
    bs.classList.remove('hidden'); bs.textContent='▶ 開始計費';
    bs.disabled=!gpsReady;
    bp.classList.add('hidden'); bt.classList.add('hidden');
  } else if(status==='running'){
    bs.classList.add('hidden');
    bp.classList.remove('hidden'); bt.classList.remove('hidden');
  } else {
    bs.classList.remove('hidden'); bs.textContent='▶ 繼續';
    bp.classList.add('hidden'); bt.classList.remove('hidden');
  }

  $('historySection').classList.toggle('hidden',hist.length===0);
}

function setGps(s){
  const e=$('gpsStatus');
  e.className=s==='active'?'gps-active':s==='error'?'gps-error':'';
  e.textContent={waiting:'GPS: 等待中',active:'GPS: 己定位',error:'GPS: 未定位'}[s]||'GPS: 等待中';
}

function stopT(){if(timerRef){clearInterval(timerRef);timerRef=null}}

function initGps(){
  if(!navigator.geolocation){setGps('error');updateUI();return}
  watchId=navigator.geolocation.watchPosition(
    p=>{
      gpsReady=true;setGps('active');
      const{latitude:la,longitude:lo,speed:gs}=p.coords;
      speed=gs!=null?Math.round(gs*3.6):0;
      if(status==='running'){
        if(lastPos){const d=hav(lastPos.lat,lastPos.lon,la,lo);if(d>3&&d<200)dist+=d}
        lastPos={lat:la,lon:lo};
      }
      updateUI();
    },
    ()=>{gpsReady=false;setGps('error');updateUI()},
    {enableHighAccuracy:true,maximumAge:2000,timeout:5000}
  );
}

function startMeter(){
  status='running'; lastPos=null;
  lastFare=fare();
  playStartSound();
  requestWakeLock();
  startTS=Date.now()-pausedE*1000;
  timerRef=setInterval(()=>{elapsed=Math.floor((Date.now()-startTS)/1000);if(speed<R.sTh)waitTime++;updateUI()},1000);
  updateUI();
}

function onStart(){if(!gpsReady)return;startMeter()}
function onPause(){status='paused';pausedE=elapsed;stopT();playPauseSound();releaseWakeLock();updateUI()}
function onReset(){
  stopT();
  playStopSound();
  releaseWakeLock();
  if(elapsed>0){
    const n=new Date();
    hist.push({fare:fare(),distance:dist,elapsed,waitTime,isNight,time:n.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})});
    renderHist();
    saveTripFile(fare(),dist,elapsed,waitTime,maxSpeed,isNight,n);
  }
  status='idle';dist=0;elapsed=0;waitTime=0;speed=0;maxSpeed=0;lastPos=null;pausedE=0;
  updateUI();
}
function toggleNight(){isNight=!isNight;updateUI()}

function pad2(n){return String(n).padStart(2,'0')}

function saveTripFile(f,d,e,w,ms,night,n){
  const filename=`TAXI_${pad2(n.getMonth()+1)}${pad2(n.getDate())}-${pad2(n.getHours())}-${pad2(n.getMinutes())}.txt`;
  const content=
`計程車計費紀錄
時間：${n.getFullYear()}/${pad2(n.getMonth()+1)}/${pad2(n.getDate())} ${pad2(n.getHours())}:${pad2(n.getMinutes())}
車資：NT$${f.toLocaleString('en-US')}
里程：${(d/1000).toFixed(2)} km
行駛時間：${fmt(e)}
等候時間：${fmt(w)}
最高時速：${ms} km/h
夜間加成：${night?'是':'否'}
`;
  const blob=new Blob(['﻿'+content],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert('已儲存檔案：'+filename);
}

function renderHist(){
  $('historyList').innerHTML=hist.map(t=>`<div class="history-item"><span class="h-time">${t.time} ${t.isNight?'🌙':'☀️'}</span><span class="h-dist">${(t.distance/1000).toFixed(2)} km</span><span class="h-dur">${fmt(t.elapsed)}</span><span class="h-fare">$${t.fare.toLocaleString()}</span></div>`).join('');
}
function clearHistory(){hist=[];renderHist();updateUI()}

updateUI();
initGps();
</script>
</body>
</html>

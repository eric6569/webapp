<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>時鐘</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="clock-container" class="clock-container">
    <div class="time-row">
      <span id="hh" class="digit-group">--</span><span class="colon">:</span><span id="mm" class="digit-group">--</span>
    </div>
    <div class="date-row">
      <span id="date-str"></span>
      <span id="weekday-str"></span>
    </div>
  </div>
  <div id="blackout-overlay" class="blackout-overlay"></div>
</div>
<script src="js/clock.js" defer></script>
<script src="js/oled-guard.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>

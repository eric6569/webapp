<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>時鐘</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="clock-container" class="clock-container">
    <div class="time-row">
      <span id="hh" class="digit-group">--</span><span class="colon">:</span><span id="mm" class="digit-group">--</span>
    </div>
    <div class="date-row">
      <span id="date-str"></span>
    </div>
  </div>
  <div id="blackout-overlay" class="blackout-overlay"></div>

  <span id="text-metrics" class="text-metrics">00-00-SUN</span>

  <div id="tap-confirm" class="tap-confirm hidden">
    <div class="dialog-box">
      <p>開啟設定?</p>
      <div class="dialog-actions">
        <button type="button" id="confirm-open-settings">確定</button>
        <button type="button" id="cancel-open-settings">取消</button>
      </div>
    </div>
  </div>

  <div id="settings-panel" class="settings-panel hidden">
    <div class="dialog-box settings-box">
      <label>顏色 1 <input type="color" id="set-color1"></label>
      <label>顏色 2 <input type="color" id="set-color2"></label>
      <label>顏色 3 <input type="color" id="set-color3"></label>
      <label>字體亮度 <input type="range" id="set-brightness" min="10" max="100" step="5"> <span id="set-brightness-val" class="value"></span></label>
      <label>時間顯示秒數 <input type="range" id="set-time-seconds" min="5" max="55" step="1"> <span id="set-time-seconds-val" class="value"></span></label>
      <label>日期顯示秒數 <input type="range" id="set-date-seconds" min="5" max="55" step="1"> <span id="set-date-seconds-val" class="value"></span></label>
      <label>字體大小 <input type="range" id="set-font-size" min="8" max="24" step="1"> <span id="set-font-size-val" class="value"></span></label>
      <label>螢幕保護移動間隔 <input type="range" id="set-drift-interval" min="30" max="300" step="10"> <span id="set-drift-interval-val" class="value"></span></label>
      <label>全黑保護週期(最低 15 分) <input type="range" id="set-blackout-interval" min="15" max="60" step="5"> <span id="set-blackout-interval-val" class="value"></span></label>
      <label>全黑持續秒數(最低 10 秒) <input type="range" id="set-blackout-duration" min="10" max="60" step="5"> <span id="set-blackout-duration-val" class="value"></span></label>
      <div class="dialog-actions">
        <button type="button" id="settings-reset">恢復預設值</button>
        <button type="button" id="settings-cancel">取消</button>
        <button type="button" id="settings-save">儲存</button>
      </div>
    </div>
  </div>
</div>
<script src="app.js" defer></script>
</body>
</html>
